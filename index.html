<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#2DC76D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Amped Calc" />
    <meta name="application-name" content="Amped Calc" />
    <meta
      name="description"
      content="Amped Calc — hydraulic fracturing field calculator"
    />
    <title>Amped Calc</title>
    <!-- Home screen / PWA icons (iOS uses apple-touch-icon; without it you get a letter tile) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Prevent light flash before React hydrates saved appearance -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ampdFrac_settings_v2');
          var mode = 'system';
          if (raw) {
            var d = JSON.parse(raw);
            if (d && (d.colorMode === 'light' || d.colorMode === 'dark' || d.colorMode === 'system')) {
              mode = d.colorMode;
            }
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.dataset.theme = 'dark';
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.style.backgroundColor = '#0B0B0F';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
